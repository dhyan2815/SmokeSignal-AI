<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SmokeSignal AI</title>
    <style>
      body { font-family: Arial; background: #f8f9fa; text-align: center; padding-top: 50px; }
      h1 { color: #d33f49; }
      form { margin-top: 40px; }
      input[type=file] { padding: 10px; border-radius: 5px; }
      button { background: #d33f49; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
      button:hover { background: #b22e3a; }
    </style>
  </head>
  <body>
    <h1>🔥 SmokeSignal AI — Wildfire Detection</h1>
    <form action="/ui/predict" method="post" enctype="multipart/form-data">
      <input type="file" name="file" accept="image/*" required>
      <button type="submit">Predict</button>
    </form>
  </body>
</html>
